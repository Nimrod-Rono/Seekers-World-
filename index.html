<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seekers-World AI Discovery</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #0b1220, #1c1f2a);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  width: 90%;
  max-width: 600px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(255,111,145,0.4);
}
input {
  width: 80%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin: 15px 0;
  font-size: 16px;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: #ff6f91;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #ff4f71;
}
#response {
  margin-top: 20px;
  text-align: left;
  font-size: 16px;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="container">
  <h1>Seekers-World 🌍</h1>
  <p>Ask anything and discover with Google:</p>
  <input type="text" id="query" placeholder="Type your question here...">
  <button onclick="ask()">Discover</button>
  <div id="response"></div>
</div>
<script>
async function ask() {
  const query = document.getElementById('query').value;
  const responseDiv = document.getElementById('response');
  
  if (!query) {
    responseDiv.innerHTML = 'Please enter a question!';
    return;
  }
  
  responseDiv.innerHTML = 'Searching... 🔍';

  try {
    const apiKey = 'AIzaSyDSIy5m7mTXlMMR_OOdCu2Af_EwoCd124w';
    const url = `https://kgsearch.googleapis.com/v1/entities:search?query=${encodeURIComponent(query)}&key=${apiKey}&limit=5&indent=True`;
    
    const res = await fetch(url);
    const data = await res.json();

    if (!data.itemListElement || data.itemListElement.length === 0) {
      responseDiv.innerHTML = 'No results found.';
      return;
    }

    let output = '';
    data.itemListElement.forEach((item, index) => {
      const entity = item.result;
      output += `${index+1}. ${entity.name || 'N/A'}\n${entity.description || 'No description'}\n\n`;
    });

    responseDiv.innerHTML = output;

  } catch (err) {
    responseDiv.innerHTML = 'Error: ' + err.message;
  }
}

  try {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer YOUR_API_KEY",
       AIzaSyDSIy5m7mTXlMMR_OOdCu2Af_EwoCd124w "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [{ role: "user", content: query }]
      })
    });

    const data = await response.json();
    responseDiv.innerHTML = data.choices[0].message.content;
  } catch (error) {
    responseDiv.innerHTML = "Error: " + error.message;
  }
}
</script>
</body>
</html>
