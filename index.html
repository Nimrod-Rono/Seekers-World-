<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seekers-World AI Discovery</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #0b1220, #1c1f2a);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  width: 90%;
  max-width: 600px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(255,111,145,0.4);
}
input {
  width: 80%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin: 15px 0;
  font-size: 16px;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: #ff6f91;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #ff4f71;
}
#response {
  margin-top: 20px;
  text-align: left;
  font-size: 16px;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="container">
  <h1>Seekers-World 🌍</h1>
  <p>Ask anything and discover:</p>
  <input type="text" id="query" placeholder="Type your question here...">
  <button onclick="ask()">Discover</button>
  <div id="response"></div>
</div>
<script>
async function ask() {
  const query = document.getElementById('query').value;
  const responseDiv = document.getElementById('response');

  if (!query) {
    responseDiv.innerHTML = 'Please enter a question!';
    return;
  }

  responseDiv.innerHTML = 'Searching... 🔍';

  try {
    // ----- GOOGLE KNOWLEDGE GRAPH -----
    const googleKey = 'AIzaSyDSIy5m7mTXlMMR_OOdCu2Af_EwoCd124w';
    const googleUrl = `https://kgsearch.googleapis.com/v1/entities:search?query=${encodeURIComponent(query)}&key=${googleKey}&limit=5&indent=True`;
    const googleRes = await fetch(googleUrl);
    const googleData = await googleRes.json();

    let output = '🔹 Google Knowledge Graph Results:\n\n';
    if (googleData.itemListElement && googleData.itemListElement.length > 0) {
      googleData.itemListElement.forEach((item, i) => {
        const entity = item.result;
        output += `${i+1}. ${entity.name || 'N/A'}\n${entity.description || 'No description'}\n`;
        if(entity.detailedDescription && entity.detailedDescription.url){
          output += `Link: ${entity.detailedDescription.url}\n`;
        }
        output += '\n';
      });
    } else {
      output += 'No results found.\n\n';
    }

    responseDiv.innerHTML = output + '🤖 AI is thinking...\n';

    // ----- OPENAI GPT (AI RESPONSE) -----
    const openaiRes = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': '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', // replace with your OpenAI API key
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [{ role: 'user', content: query }]
      })
    });

    const openaiData = await openaiRes.json();
    const aiText = openaiData.choices[0].message.content;

    responseDiv.innerHTML = output + '🤖 AI Response:\n\n' + aiText;

  } catch (err) {
    responseDiv.innerHTML = 'Error: ' + err.message;
  }
}
</script>
</body>
</html>
